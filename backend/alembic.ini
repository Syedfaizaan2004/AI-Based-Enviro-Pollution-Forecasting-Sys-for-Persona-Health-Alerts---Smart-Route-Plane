# ==============================================================================
# Alembic Configuration
# ==============================================================================
# This file is read by `alembic` commands. The DATABASE_URL is injected
# programmatically in alembic/env.py so this file does NOT need to hold
# credentials (no sqlalchemy.url line here).
# ==============================================================================

[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = alembic

# Template for naming new migration files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path so `app` is importable from within env.py.
prepend_sys_path = .

# Timezone for migration timestamps.
timezone = UTC

# Source encoding.
source_encoding = utf-8

# ── Logging ──────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
