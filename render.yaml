services:
  - type: web
    name: pollution-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pollution-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pollution-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://pollution-frontend.onrender.com
      - key: DEBUG
        value: "False"
    envGroups:
      - pollution-secrets

  - type: static
    name: pollution-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pollution-backend.onrender.com
    envGroups:
      - pollution-secrets

  - type: redis
    name: pollution-redis
    plan: free
    ipAllowList: [] # Blank means accessible only by your other Render services

databases:
  - name: pollution-db
    plan: free
    ipAllowList: [] # Blank means accessible only by your other Render services

envGroups:
  - name: pollution-secrets
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WAQI_API_KEY
        sync: false
      - key: SARVAM_AI_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_OPENWEATHER_API_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
